services:

  postgres:
    container_name: "components-jooq"
    image: postgres:15
    command: [
        "postgres",
        "-c", "log_min_duration_statement=1000",
        "-c", "log_statement=none",
        "-c", "log_duration=off",
    ]
    volumes:
      - components-jooq-data:/var/lib/postgresql/data
    ports:
      - 5431:5432
    environment:
      - POSTGRES_USER=components
      - POSTGRES_PASSWORD=components
      - POSTGRES_DB=components
    healthcheck:
      # -h forces TCP so the socket-only server used during initdb is not reported as ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U components -d components"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: always

volumes:
  components-jooq-data:
    driver: local
