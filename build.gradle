import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

buildscript {
	ext {
		javaVersion = '17'
		springBootVersion = '3.5.16'
		kotlinVersion = '2.4.21'
		awsJavaSdkVersion = '1.11.739'
		// Gradle plugin only (build-time migrations); the runtime Flyway version is managed by Spring Boot
		flywayPluginVersion = '13.10.0'
	}
	dependencies {
		// opening all Kotlin classes by default so that Spring can do its proxy magic
		classpath "org.jetbrains.kotlin:kotlin-allopen:${kotlinVersion}"
		// the Flyway Gradle plugin only discovers database support on its own classpath
		classpath "org.flywaydb:flyway-database-postgresql:${flywayPluginVersion}"
	}
}

plugins {
	// Defining the versions of Gradle plugins to use in the sub-projects.
	// "apply false" means that the plugin is no applied by default and has to be activated
	// in the subprojects specifically.
	id 'org.springframework.boot' version "${springBootVersion}" apply false
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}"
	id 'org.jetbrains.kotlin.plugin.spring' version "${kotlinVersion}"
	id 'org.flywaydb.flyway' version "${flywayPluginVersion}" apply false
	id 'nu.studer.jooq' version '9.0' apply false
	id 'com.avast.gradle.docker-compose' version '0.17.21' apply false
}

group = 'io.reflectoring'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
}

repositories {
	mavenCentral()
}

subprojects {

	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'java-library'
	apply plugin: 'org.jetbrains.kotlin.jvm'
	apply plugin: 'org.jetbrains.kotlin.plugin.spring'

	group = 'io.reflectoring'
	version = '0.0.1-SNAPSHOT'
	java {
		sourceCompatibility = JavaVersion.toVersion(rootProject.javaVersion)
		targetCompatibility = JavaVersion.toVersion(rootProject.javaVersion)
	}

	repositories {
		mavenLocal()
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom("org.springframework.boot:spring-boot-dependencies:${rootProject.springBootVersion}") {
				// keep the Kotlin stdlib in line with the Kotlin Gradle plugin
				bomProperty 'kotlin.version', rootProject.kotlinVersion
			}
			mavenBom("com.amazonaws:aws-java-sdk-bom:${rootProject.awsJavaSdkVersion}")
		}

		dependencies {
			// SQS
			dependency 'io.reflectoring:sqs-starter:0.0.11'
			dependency 'io.reflectoring:sqs-starter-test:0.0.11'

			// testing
			dependency 'org.reflections:reflections:0.9.10'
			dependency 'org.mockito.kotlin:mockito-kotlin:4.0.0'
			dependency 'com.tngtech.archunit:archunit-junit5:0.21.0'

		}
	}

	// Standard dependencies for all modules
	dependencies {

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation project(':common:testcontainers')
		testImplementation 'org.mockito.kotlin:mockito-kotlin'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.withType(KotlinCompile).configureEach {
		compilerOptions {
			freeCompilerArgs.add('-Xjsr305=strict')
			jvmTarget = JvmTarget.fromTarget(rootProject.javaVersion)
		}
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
